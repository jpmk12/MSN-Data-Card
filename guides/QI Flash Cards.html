<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-17 PIQ Sim Study Guide — Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #1a1d24;
    --border: #2a2f3a;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #39ff14;
    --text: #e8eaf0;
    --text-muted: #6b7280;
    --card-front: #111827;
    --card-back: #0f1e2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    background: rgba(10,12,16,0.9);
    backdrop-filter: blur(8px);
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .logo-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,212,255,0.4);
  }

  .logo-sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .main {
    position: relative;
    z-index: 5;
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* Category Filter */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .filter-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.07);
  }

  /* Progress bar */
  .progress-container {
    margin-bottom: 28px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .progress-bar {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Card */
  .card-area {
    perspective: 1200px;
    margin-bottom: 24px;
  }

  .flashcard {
    position: relative;
    width: 100%;
    min-height: 300px;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
    cursor: pointer;
  }

  .flashcard.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 8px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 300px;
  }

  .card-front {
    background: var(--card-front);
    border: 1px solid var(--border);
    box-shadow: 0 0 40px rgba(0,212,255,0.05), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .card-back {
    background: var(--card-back);
    border: 1px solid rgba(0,212,255,0.3);
    box-shadow: 0 0 40px rgba(0,212,255,0.1), inset 0 1px 0 rgba(0,212,255,0.08);
    transform: rotateY(180deg);
  }

  .card-category-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-category-tag::before {
    content: '';
    width: 20px;
    height: 1px;
    background: var(--accent2);
  }

  .card-question {
    font-size: 1.2rem;
    font-weight: 500;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
    display: flex;
    align-items: center;
  }

  .card-hint {
    margin-top: 24px;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-align: center;
  }

  .card-answer-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-answer-label::before {
    content: '';
    width: 20px;
    height: 1px;
    background: var(--accent);
  }

  .card-answer {
    font-size: 1.1rem;
    line-height: 1.7;
    color: var(--text);
    flex: 1;
  }

  .card-answer strong, .card-answer .num {
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-weight: 500;
  }

  .card-answer ul {
    list-style: none;
    padding: 0;
  }

  .card-answer ul li {
    padding: 4px 0 4px 16px;
    position: relative;
  }

  .card-answer ul li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 12px 28px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .btn-ghost:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
    font-weight: 600;
  }

  .btn-primary:hover {
    background: #33ddff;
    box-shadow: 0 0 20px rgba(0,212,255,0.3);
  }

  .btn-danger {
    background: transparent;
    border: 1px solid #ff4444;
    color: #ff4444;
  }

  .btn-danger:hover {
    background: rgba(255,68,68,0.1);
  }

  .btn-success {
    background: transparent;
    border: 1px solid var(--accent3);
    color: var(--accent3);
  }

  .btn-success:hover {
    background: rgba(57,255,20,0.08);
  }

  .card-counter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--text-muted);
    min-width: 80px;
    text-align: center;
    letter-spacing: 2px;
  }

  /* Score buttons */
  .score-section {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }

  .score-section.visible {
    display: flex;
  }

  .score-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .score-btns {
    display: flex;
    gap: 12px;
  }

  /* Shuffle / reset */
  .deck-controls {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 16px;
  }

  .btn-sm {
    padding: 6px 16px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    transition: all 0.2s;
  }

  .btn-sm:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  /* Done screen */
  .done-screen {
    display: none;
    text-align: center;
    padding: 60px 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .done-screen.visible { display: block; }

  .done-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    color: var(--accent);
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(0,212,255,0.4);
    margin-bottom: 8px;
  }

  .done-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 5rem;
    color: var(--text);
    line-height: 1;
    margin: 20px 0;
  }

  .done-sub { color: var(--text-muted); margin-bottom: 32px; }

  /* Keyboard hint */
  .kb-hints {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .kb-hint {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 7px;
    font-size: 0.7rem;
    color: var(--text);
  }

  @media (max-width: 600px) {
    .card-face { padding: 28px 24px; }
    .card-question { font-size: 1rem; }
    .card-answer { font-size: 0.95rem; }
    .logo-title { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-title">C-17 PIQ</span>
    <span class="logo-sub">Sim Study Guide — Flashcards</span>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Cards</div></div>
    <div class="stat"><div class="stat-num" id="stat-known" style="color:var(--accent3)">0</div><div class="stat-label">Known</div></div>
    <div class="stat"><div class="stat-num" id="stat-review" style="color:var(--accent2)">0</div><div class="stat-label">Review</div></div>
  </div>
</header>

<div class="main">
  <div class="filter-bar" id="filter-bar"></div>

  <div class="deck-controls">
    <button class="btn-sm" onclick="shuffleDeck()">⇌ Shuffle</button>
    <button class="btn-sm" onclick="resetScores()">↺ Reset All</button>
    <button class="btn-sm" onclick="showOnlyReview()">Show Review Only</button>
  </div>

  <div class="progress-container">
    <div class="progress-label">
      <span id="progress-text">Card 1 of 0</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <div class="card-area" id="card-area">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="card-face card-front" id="card-front">
        <div class="card-category-tag" id="card-cat-tag">Category</div>
        <div class="card-question" id="card-question">Loading...</div>
        <div class="card-hint">Click card or press SPACE to reveal answer</div>
      </div>
      <div class="card-face card-back" id="card-back">
        <div class="card-answer-label">Answer</div>
        <div class="card-answer" id="card-answer">Answer here</div>
      </div>
    </div>
  </div>

  <div class="score-section" id="score-section">
    <div class="score-label">How well did you know this?</div>
    <div class="score-btns">
      <button class="btn btn-danger" onclick="markCard('review')">✗ Review Again</button>
      <button class="btn btn-success" onclick="markCard('known')">✓ Got It</button>
    </div>
  </div>

  <div style="height:16px"></div>

  <div class="controls">
    <button class="btn btn-ghost" onclick="prevCard()">← Prev</button>
    <span class="card-counter" id="card-counter">1 / 0</span>
    <button class="btn btn-primary" onclick="nextCard()">Next →</button>
  </div>

  <div class="kb-hints">
    <span class="kb-hint"><span class="kbd">Space</span> Flip</span>
    <span class="kb-hint"><span class="kbd">→</span> Next</span>
    <span class="kb-hint"><span class="kbd">←</span> Prev</span>
    <span class="kb-hint"><span class="kbd">G</span> Got It</span>
    <span class="kb-hint"><span class="kbd">R</span> Review</span>
  </div>

  <div class="done-screen" id="done-screen">
    <div class="done-title">Deck Complete</div>
    <div class="done-score" id="done-score">0 / 0</div>
    <div class="done-sub">cards marked as known</div>
    <button class="btn btn-primary" onclick="resetDeck()">Start Over</button>
  </div>
</div>

<script>
const ALL_CARDS = [
  // ── MEMORY ITEMS ──────────────────────────────────────────
  {
    cat: "Memory Items",
    q: "What are the three Memory Items (commit to memory)?",
    a: `<ul>
      <li>Loss of Pressurization</li>
      <li>Smoke, Fire, or Fumes</li>
      <li>Pitch Runaway Recovery</li>
    </ul>`
  },
  {
    cat: "Memory Items",
    q: "Loss of Pressurization memory item — what do you do?",
    a: `Oxygen — <strong>On, 100%</strong> (All crew)`
  },
  {
    cat: "Memory Items",
    q: "Smoke, Fire, or Fumes memory item — what do you do?",
    a: `Oxygen — <strong>On, 100%</strong> (All crew)`
  },
  {
    cat: "Memory Items",
    q: "Pitch Runaway Recovery memory items — what are the two actions?",
    a: `<ul>
      <li>Pitch Authority: Stab Trim Handles — <strong>Split Beyond Detent and Hold</strong></li>
      <li>Aircraft Control — <strong>Maintain</strong></li>
    </ul>`
  },
  {
    cat: "Memory Items",
    q: "What does 'Stabilizer Motion' mean in the Pitch Runaway context?",
    a: `It is the action cue: split stab trim handles beyond detent and hold — annotated as a Memory Item (boxed M).`
  },

  // ── QRC ──────────────────────────────────────────────────
  {
    cat: "QRC / Procedures",
    q: "What does QRG stand for and what does it contain?",
    a: `Quick Reaction Guide — supports orderly sequence from emergency onset to resolution. Contains: <strong>QRC, Memory Maneuver Items, Ground Evacuation, Quick Reference Index.</strong>`
  },
  {
    cat: "QRC / Procedures",
    q: "What is the QRC (Quick Reaction Card)?",
    a: `Time-critical steps executed <strong>before</strong> referencing TO 1C-17A-1CL-1.`
  },
  {
    cat: "QRC / Procedures",
    q: "List all items on the QRC (left column).",
    a: `<ul>
      <li>Loss of Pressurization (M)</li>
      <li>Smoke, Fire, or Fumes (M)</li>
      <li>Pitch Runaway Recovery (M)</li>
      <li>Four Engine Flameout</li>
      <li>Emergency Engine Shutdown</li>
      <li>Compressor Stall/Surges</li>
      <li>Tailpipe Fire</li>
      <li>APU Fire: Overhead Panel</li>
    </ul>`
  },
  {
    cat: "QRC / Procedures",
    q: "List all items on the QRC (right column).",
    a: `<ul>
      <li>"Fuel Tank Pressure"</li>
      <li>Ground Evacuation — Engines On</li>
      <li>Ditching (Forced)</li>
      <li>Volcanic Ash Penetration</li>
      <li>Thunderstorm, Turbulence, or Heavy Rain Penetration</li>
      <li>Forced Landing</li>
      <li>ALS/Stall Warning Erroneous Indications (Nose Damage)</li>
    </ul>`
  },
  {
    cat: "QRC / Procedures",
    q: "What are the Memory Maneuver Items?",
    a: `<ul>
      <li>Breakaway</li>
      <li>Emergency Descent</li>
      <li>Engine Failure Takeoff/Climb Phase Flight Profile</li>
      <li>GPWS/TAWS Alerts: Terrain Warning Maneuver</li>
      <li>"OVERSPEED" Warning Response</li>
      <li>Rejected Takeoff</li>
      <li>"STALL" Warning/ALS Response</li>
      <li>TCAS Resolution Advisory Response</li>
      <li>"WINDSHEAR" Warning Response</li>
    </ul>`
  },
  {
    cat: "QRC / Procedures",
    q: "Crew coordination — who calls the procedure and how is QRC accomplished?",
    a: `PF calls the procedure. PM uses QRC in <strong>read-do format</strong>. Once complete, proceed to appropriate TO 1C-17A-1CL-1.`
  },

  // ── LIFE SUPPORT / EGRESS ────────────────────────────────
  {
    cat: "Life Support / Egress",
    q: "Normal oxygen pressure range?",
    a: `<strong>285 – 430 psi</strong>`
  },
  {
    cat: "Life Support / Egress",
    q: "How many FEDS initiators and where are they located?",
    a: `<strong>7</strong> initiators: (1) Maintenance/ditching hatch, (1) Forward outboard corner of forward loadmaster station, (4) FEDS hatches, (1) Upper leading edge of left wing root fairing (accessible through external latch cover).`
  },
  {
    cat: "Life Support / Egress",
    q: "List all escape exits on the C-17.",
    a: `(2) Pilots' windows, (1) Maintenance ditching hatch, (1) Crew entry door, (1) Forward escape hatch, (2) Troop doors, (1) Cargo ramp, (4) FEDS hatch openings. <strong>Summary: 8 + 4 FEDS + 4 chop-outs = 16</strong>`
  },
  {
    cat: "Life Support / Egress",
    q: "Escape ropes are located at which exits?",
    a: `(2) Pilots' windows, (1) Maintenance ditching hatch, (1) Forward escape hatch, (4) FEDS hatches, (2) Troop doors.`
  },
  {
    cat: "Life Support / Egress",
    q: "How many fire extinguishers total and where?",
    a: `<strong>9 total:</strong> (2) Cockpit left & right, (1) Crew rest area, (6) Cargo compartment`
  },
  {
    cat: "Life Support / Egress",
    q: "How many crash axes and where?",
    a: `<strong>2 total:</strong> (1) Crew Rest Bulkhead, (1) Mid right side of cargo compartment`
  },
  {
    cat: "Life Support / Egress",
    q: "How many walk-around oxygen bottles and where?",
    a: `<strong>10 total:</strong> (2) Cockpit (L & R), (1) Crew rest area, (1) Lavatory, (1) Forward LM station, (5) Cargo compartment`
  },
  {
    cat: "Life Support / Egress",
    q: "How many life rafts and what is normal/overflow capacity?",
    a: `<strong>3 rafts</strong> (no raft in aft left FEDS raft container). Normal capacity: <strong>46</strong>; overflow: <strong>69</strong>`
  },
  {
    cat: "Life Support / Egress",
    q: "How many first aid kits are installed with the aircraft?",
    a: `<strong>(2)</strong> in crew rest, <strong>(4)</strong> in cargo compartment = <strong>6 installed</strong>. Racks provided for stowage of 26 total.`
  },
  {
    cat: "Life Support / Egress",
    q: "How many EEBDs and where?",
    a: `<strong>6 total:</strong> (2) Crew rest, (4) Cargo compartment`
  },
  {
    cat: "Life Support / Egress",
    q: "How many EPOS?",
    a: `<strong>102</strong>`
  },
  {
    cat: "Life Support / Egress",
    q: "How many smoke detectors total and where?",
    a: `<strong>22 total:</strong> (2) Avionics cooling, (1) Crew rest, (1) Lavatory, (4) IRU, (14) Cargo compartment (AFT/MID/FWD).`
  },
  {
    cat: "Life Support / Egress",
    q: "Walk-around bottle — which O2 bottle must be fast-fill on the C-17?",
    a: `LM and Crewrest O2 bottles must be <strong>fast-fill</strong>. Unmodified and Modified 2 bottles are fast-fill. Modified bottles are slow-fill (dangerous — can empty faster than you can fill).`
  },
  {
    cat: "Life Support / Egress",
    q: "O2 system — where is the crew oxygen converter and auxiliary converter?",
    a: `Crew O2 converter (<strong>25L</strong>) — unpressurized compartment, right side nose gear well. Auxiliary converter (<strong>75L</strong>) — same compartment on right side. Passenger converter (<strong>75L</strong>) — left nose compartment outboard of nose landing gear.`
  },
  {
    cat: "Life Support / Egress",
    q: "When does CREW OXY LOW illuminate?",
    a: `Crew O2 converter quantity < <strong>5 liters</strong> OR supply pressure < <strong>60 ± 5 psi</strong>`
  },
  {
    cat: "Life Support / Egress",
    q: "When does PASS OXY LOW / AUX OXY LOW display on WAP?",
    a: `Passenger or Aux O2 converter quantity < <strong>7.5 liters</strong> OR supply pressure < <strong>60 ± 5 psi</strong>. Required pressure is <strong>285–430 psi</strong>.`
  },
  {
    cat: "Life Support / Egress",
    q: "Where is the Emergency Ground Egress Checklist?",
    a: `CL1, QRI — go back 1 or 2 pages depending on whether engines are running.`
  },

  // ── WINDSHEAR ────────────────────────────────────────────
  {
    cat: "Windshear",
    q: "PF windshear recognition cues (takeoff/approach)?",
    a: `<ul>
      <li>Hesitant or excessive A/S buildup on takeoff or uncommanded A/S change of <strong>±10 KCAS</strong></li>
      <li>Uncommanded FPV change of <strong>±2°</strong> or VVI change of <strong>500 FPM</strong></li>
      <li>Excessive radar altitude sink rate</li>
      <li>Excessive nose high/low pitch attitude</li>
    </ul>`
  },

    a: `Decrab (unless still IMC), stabilized: ±10/-5 airspeed, FPV touching API, within lateral confines of runway. PACAH set.`
  },
  {
    cat: "TOLD / Landing",
    q: "High crosswind rejection on T/O — what conditions?",
    a: `High speed regime (above 80 kts): reject only if failure jeopardizes safety of flight. Examples: Fire, Engine Failure, Windshear, Shifting cargo, Degraded directional control.`
  },

  // ── RNAV ─────────────────────────────────────────────────
  {
    cat: "RNAV / Navigation",
    q: "RNAV — substitute vs alternate means of navigation?",
    a: `<strong>Substitute:</strong> RNAV in lieu of out-of-service conventional NAVAIDs. <strong>Alternate:</strong> RNAV in lieu of operational conventional NAVAIDs without monitoring them. On final approach: underlying NAVAID must be operational and monitored for course alignment.`
  },
  {
    cat: "RNAV / Navigation",
    q: "When must a Predictive RAIM check be accomplished?",
    a: `During planning when RNAV operations use SIDs, STARs, or approaches and no other backup NAV aids are available to identify planned outages. (T-1)`
  },
  {
    cat: "RNAV / Navigation",
    q: "MSN scale limit for RNP ≥ 4 NM?",
    a: `Label: <strong>4.0 NM</strong>, Precision: <strong>2 NM/dot</strong>`
  },
  {
    cat: "RNAV / Navigation",
    q: "MSN scale limit for RNP < 1 NM?",
    a: `Label: <strong>0.3 NM</strong>, Precision: <strong>0.15 NM/dot</strong>`
  },

  // ── ADVISORY CALLS ───────────────────────────────────────
  {
    cat: "Advisory Calls",
    q: "Climb Out — what does PM call at Transition Altitude?",
    a: `"Transition Altitude, 29.92, Set" (or 1013). PF responds: "29.92, Set" (or 1013).`
  },
  {
    cat: "Advisory Calls",
    q: "Descent — what does PM call at Transition Level?",
    a: `"Transition Altitude, (local altimeter), Set." PF responds: "(local altimeter), Set."`
  },
  {
    cat: "Advisory Calls",
    q: "Non-precision approach — PM calls at 500' above touchdown?",
    a: `"500, stable" or "Go-around, unstable." PF: (Acknowledge).`
  },
  {
    cat: "Advisory Calls",
    q: "Precision approach — PM calls at 100' above DH/DA?",
    a: `"100 above." At DH/DA: "Minimums." At 100' above TDZE (CAT I ILS): "100 feet."`
  },
];

let deck = [...ALL_CARDS];
let currentIdx = 0;
let flipped = false;
let scores = {}; // index -> 'known' | 'review'
let activeCategory = 'All';
let filteredDeck = [...deck];

// Build category list
function getCategories() {
  const cats = ['All', ...new Set(ALL_CARDS.map(c => c.cat))];
  return cats;
}

function buildFilterBar() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  getCategories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === activeCategory ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => selectCategory(cat);
    bar.appendChild(btn);
  });
}

function selectCategory(cat) {
  activeCategory = cat;
  buildFilterBar();
  if (cat === 'All') {
    filteredDeck = [...deck];
  } else {
    filteredDeck = deck.filter(c => c.cat === cat);
  }
  currentIdx = 0;
  showCard();
}

function showCard() {
  const card = filteredDeck[currentIdx];
  if (!card) return;

  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('score-section').classList.remove('visible');

  document.getElementById('card-cat-tag').textContent = card.cat;
  document.getElementById('card-question').textContent = card.q;
  document.getElementById('card-answer').innerHTML = card.a;

  const total = filteredDeck.length;
  document.getElementById('card-counter').textContent = `${currentIdx + 1} / ${total}`;
  document.getElementById('progress-text').textContent = `Card ${currentIdx + 1} of ${total}`;
  const pct = total > 0 ? Math.round(((currentIdx + 1) / total) * 100) : 0;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  updateStats();

  document.getElementById('card-area').style.display = 'block';
  document.getElementById('done-screen').classList.remove('visible');
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
  if (flipped) {
    document.getElementById('score-section').classList.add('visible');
  } else {
    document.getElementById('score-section').classList.remove('visible');
  }
}

function markCard(status) {
  const globalIdx = ALL_CARDS.indexOf(filteredDeck[currentIdx]);
  scores[globalIdx] = status;
  updateStats();
  nextCard();
}

function nextCard() {
  if (currentIdx < filteredDeck.length - 1) {
    currentIdx++;
    showCard();
  } else {
    showDoneScreen();
  }
}

function prevCard() {
  if (currentIdx > 0) {
    currentIdx--;
    showCard();
  }
}

function showDoneScreen() {
  document.getElementById('card-area').style.display = 'none';
  document.getElementById('score-section').classList.remove('visible');
  const done = document.getElementById('done-screen');
  done.classList.add('visible');
  const known = Object.values(scores).filter(v => v === 'known').length;
  const total = Object.keys(scores).length;
  document.getElementById('done-score').textContent = `${known} / ${total}`;
}

function resetDeck() {
  currentIdx = 0;
  showCard();
}

function shuffleDeck() {
  for (let i = filteredDeck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredDeck[i], filteredDeck[j]] = [filteredDeck[j], filteredDeck[i]];
  }
  currentIdx = 0;
  showCard();
}

function resetScores() {
  scores = {};
  updateStats();
}

function showOnlyReview() {
  const reviewIndices = new Set(
    Object.entries(scores).filter(([,v]) => v === 'review').map(([k]) => parseInt(k))
  );
  const reviewCards = ALL_CARDS.filter((_, i) => reviewIndices.has(i));
  if (reviewCards.length === 0) {
    alert('No cards marked for review yet!');
    return;
  }
  filteredDeck = reviewCards;
  activeCategory = 'Review';
  buildFilterBar();
  currentIdx = 0;
  showCard();
}

function updateStats() {
  const known = Object.values(scores).filter(v => v === 'known').length;
  const review = Object.values(scores).filter(v => v === 'review').length;
  document.getElementById('stat-total').textContent = filteredDeck.length;
  document.getElementById('stat-known').textContent = known;
  document.getElementById('stat-review').textContent = review;
}

// Keyboard controls
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === 'g' || e.key === 'G') { if (flipped) markCard('known'); }
  if (e.key === 'r' || e.key === 'R') { if (flipped) markCard('review'); }
});

// Init
buildFilterBar();
showCard();
</script>
